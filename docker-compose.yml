version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
