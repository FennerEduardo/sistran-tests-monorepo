version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: sistran_backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=SistranDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: sistran_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
