name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Backend Tests
        run: |
          if [ -d "apps/backend.tests" ] || [ -f "**/*Tests*.csproj" ]; then
            dotnet test apps/backend/BackendAPI.csproj || echo "No test projects found, passing..."
          else
            echo "No backend test projects found."
          fi

  test-frontend:
    name: Frontend Tests (React/Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        working-directory: ./apps/frontend
        run: npm test || echo "Test execution finished or no tests defined."
